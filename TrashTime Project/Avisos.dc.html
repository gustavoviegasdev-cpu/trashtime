<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #1F7A45; text-decoration: none; }
    a:hover { color: #14532D; }
    button { font-family: inherit; border: 0; background: none; padding: 0; margin: 0; color: inherit; cursor: pointer; text-align: left; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #F2F5F3; color: #0F1D14;">

  <div style="background: #14532D; padding: 54px 20px 22px; display: flex; align-items: flex-end; gap: 12px;">
    <div style="flex-grow: 1;">
      <div style="font-size: 21px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.3px;">Avisos</div>
      <div style="font-size: 13px; font-weight: 500; color: #A9D3B9; margin-top: 3px;">{{ unreadLabel }}</div>
    </div>
    <button onClick="{{ markAll }}" style="height: 34px; padding: 0 12px; border-radius: 11px; background: #1F7A45; color: #FFFFFF; font-size: 11.5px; font-weight: 700;">Marcar lidas</button>
  </div>

  <div style="display: flex; gap: 7px; padding: 14px 14px 0;">
    <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
      <button onClick="{{ f.pick }}" style="flex-grow: 1; flex-basis: 0; height: 44px; border-radius: 12px; background: {{ f.bg }}; color: {{ f.fg }}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{ f.label }}</button>
    </sc-for>
  </div>

  <div style="flex-grow: 1; min-height: 0; padding: 16px 14px 0; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{ items }}" as="n" hint-placeholder-count="4">
      <button onClick="{{ n.toggle }}" style="width: 100%; background: {{ n.bg }}; border-radius: 16px; padding: 13px; display: flex; align-items: flex-start; gap: 12px; box-shadow: 0 2px 8px rgba(15,29,20,0.05);">
        <div style="width: 40px; height: 40px; border-radius: 13px; background: {{ n.iconBg }}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <sc-if value="{{ n.isTruck }}" hint-placeholder-val="{{ true }}">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{ n.iconFg }}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 16V9a1 1 0 0 1 1-1h9v9H3a1 1 0 0 1-1-1z"></path>
              <path d="M12 11h4l3.5 3.5V17h-7.5"></path>
              <path d="M4.5 8V6h6v2"></path>
              <circle cx="6.5" cy="18.5" r="1.7"></circle>
              <circle cx="16" cy="18.5" r="1.7"></circle>
            </svg>
          </sc-if>
          <sc-if value="{{ n.isClock }}" hint-placeholder-val="{{ false }}">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{ n.iconFg }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="8.5"></circle>
              <path d="M12 6.8V12l3.4 2.2"></path>
            </svg>
          </sc-if>
          <sc-if value="{{ n.isAlert }}" hint-placeholder-val="{{ false }}">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{ n.iconFg }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 4.2 21 19.4H3z"></path>
              <path d="M12 10v4M12 16.6v.1"></path>
            </svg>
          </sc-if>
        </div>
        <div style="flex-grow: 1;">
          <div style="display: flex; align-items: baseline; gap: 8px;">
            <div style="flex-grow: 1; font-size: 14px; font-weight: {{ n.titleWeight }}; letter-spacing: -0.2px; line-height: 1.25;">{{ n.title }}</div>
            <div style="font-size: 10.5px; font-weight: 600; color: #8A968D; flex-shrink: 0;">{{ n.time }}</div>
          </div>
          <div style="font-size: 12px; font-weight: 500; color: #5A6960; margin-top: 4px; line-height: 1.4;">{{ n.body }}</div>
        </div>
        <div style="width: 9px; height: 9px; border-radius: 5px; background: {{ n.dot }}; margin-top: 5px; flex-shrink: 0;"></div>
      </button>
    </sc-for>

    <div style="margin-top: auto; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 10px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A968D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"></circle>
        <path d="M12 11.4v5M12 7.8v.1"></path>
      </svg>
      <div style="font-size: 11.5px; font-weight: 600; color: #8A968D;">Avisos são guardados por 30 dias</div>
    </div>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #E4EAE6; padding: 9px 8px 20px; display: flex;">
    <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8A968D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"></path>
        <circle cx="12" cy="10" r="2.5"></circle>
      </svg>
      <div style="font-size: 10.5px; font-weight: 600; color: #8A968D;">Mapa</div>
    </div>
    <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8A968D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="16" rx="3"></rect>
        <path d="M3 10h18M8 3v4M16 3v4"></path>
      </svg>
      <div style="font-size: 10.5px; font-weight: 600; color: #8A968D;">Calendário</div>
    </div>
    <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0;">
      <div style="position: relative;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="#E8F5EC" stroke="#1F7A45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"></path>
          <path d="M10.3 20a2 2 0 0 0 3.4 0"></path>
        </svg>
        <sc-if value="{{ hasUnread }}" hint-placeholder-val="{{ true }}">
          <div style="position: absolute; top: -3px; right: -5px; min-width: 15px; height: 15px; border-radius: 8px; background: #E8A317; color: #FFFFFF; font-size: 9.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF;">{{ unreadCount }}</div>
        </sc-if>
      </div>
      <div style="font-size: 10.5px; font-weight: 700; color: #1F7A45;">Avisos</div>
    </div>
    <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8A968D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"></circle>
        <path d="M12 2.5v2.2M12 19.3v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"></path>
      </svg>
      <div style="font-size: 10.5px; font-weight: 600; color: #8A968D;">Configurações</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'todos', read: { 3: true, 4: true, 5: true } };
  }
  data() {
    return [
      { id: 1, kind: 'caminhao', title: 'Caminhão a 400 m de você', body: 'O CT-118 está chegando na Rua das Acácias. Leve o lixo para a calçada.', time: 'agora' },
      { id: 2, kind: 'horario', title: 'Coleta de amanhã mudou', body: 'Terça, 25/08, o Centro passa a ser coletado das 05:30 às 08:30.', time: 'há 2 h' },
      { id: 3, kind: 'aviso', title: 'Mutirão de recicláveis', body: 'Entrega voluntária na Praça da Matriz, das 08:00 às 12:00.', time: 'ontem' },
      { id: 4, kind: 'caminhao', title: 'Coleta concluída na rua', body: 'O CT-118 finalizou a Rua das Acácias às 07:12 de hoje.', time: 'ontem' },
      { id: 5, kind: 'horario', title: 'Feriado altera a coleta', body: 'Não haverá coleta comum na segunda. Reposição na terça, 08/09.', time: 'há 3 dias' }
    ];
  }
  renderVals() {
    const all = this.data();
    const read = this.state.read;
    const f = this.state.filter;
    const unread = all.filter((n) => !read[n.id]).length;
    const visible = all.filter((n) => f === 'todos' || n.kind === f);
    const chip = (id, label) => ({
      label: label,
      bg: f === id ? '#14532D' : '#FFFFFF',
      fg: f === id ? '#FFFFFF' : '#3C4A41',
      pick: () => this.setState({ filter: id })
    });
    return {
      filters: [chip('todos', 'Todos'), chip('caminhao', 'Caminhão'), chip('horario', 'Horário'), chip('aviso', 'Avisos')],
      items: visible.map((n) => {
        const isRead = !!read[n.id];
        return {
          title: n.title,
          body: n.body,
          time: n.time,
          isTruck: n.kind === 'caminhao',
          isClock: n.kind === 'horario',
          isAlert: n.kind === 'aviso',
          bg: isRead ? '#FFFFFF' : '#FBFEFC',
          iconBg: n.kind === 'aviso' ? '#FDF3E0' : '#E8F5EC',
          iconFg: n.kind === 'aviso' ? '#A96F06' : '#1F7A45',
          dot: isRead ? 'transparent' : '#2FA85A',
          titleWeight: isRead ? '600' : '800',
          toggle: () => {
            const next = Object.assign({}, this.state.read);
            if (next[n.id]) { delete next[n.id]; } else { next[n.id] = true; }
            this.setState({ read: next });
          }
        };
      }),
      unreadLabel: unread > 0 ? unread + ' não lidos · toque para marcar' : 'Tudo em dia por aqui',
      unreadCount: unread,
      hasUnread: unread > 0,
      markAll: () => {
        const next = {};
        all.forEach((n) => { next[n.id] = true; });
        this.setState({ read: next });
      }
    };
  }
}
</script>
</body>
</html>
