<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#14532D">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <meta name="description"
        content="Acompanhe em tempo real os caminhões de coleta de lixo, os dias de coleta do seu bairro e receba aviso quando o caminhão se aproximar.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icone-192.png">
    <link rel="apple-touch-icon" href="icone-apple.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TrashTime — acompanhe a coleta de lixo</title>
    <script>
        // Escolhe o tema antes da primeira pintura: sem isso a tela pisca
        // clara por um instante antes do app.js rodar.
        (function () {
            try {
                var salvo = JSON.parse(localStorage.getItem('trashtime'));
                var tema = salvo && salvo.config && salvo.config.tema;
                if (!tema) {
                    tema = window.matchMedia &&
                        window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
                }
                document.documentElement.setAttribute('data-tema', tema);
                var marca = document.querySelector('meta[name="theme-color"]');
                if (marca) { marca.setAttribute('content', tema === 'escuro' ? '#0B0F0C' : '#14532D'); }
            } catch (erro) {
                document.documentElement.setAttribute('data-tema', 'claro');
            }
        })();
    </script>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
